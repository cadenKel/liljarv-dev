<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JarvStore - Premium Products</title>
    <meta name="description" content="Buy premium products from JarvStore">
    <!-- Stripe Snipcart checkout -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@snipcart/checkout-ui@1.8.0/dist/snipcart.min.css">
    <script src="https://checkout.snipcart.com/v1.8.0/snipcart.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; color: #2c3e50; }
        header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 2rem; text-align: center; }
        header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; margin-top: 2rem; }
        .product-card { background: white; border-radius: 12px; padding: 1.5rem; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-5px); }
        .product-image { width: 100%; height: 200px; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); border-radius: 8px; margin-bottom: 1rem; }
        .product-title { font-size: 1.25rem; font-weight: bold; color: #2c3e50; margin-bottom: 0.5rem; }
        .product-price { font-size: 1.5rem; color: #27ae60; font-weight: bold; margin-bottom: 1rem; }
        .product-description { color: #666; margin-bottom: 1rem; }
        .btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-size: 1rem; font-weight: 500; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        footer { background: #333; color: white; text-align: center; padding: 2rem; margin-top: 4rem; }
    </style>
</head>
<body>
    <header>
        <h1>JarvStore</h1>
        <p>Premium Products - Fast Shipping</p>
    </header>

    <div class="container">
        <snipcart check-out="true" name="JarvStore" locale="en" currency="USD" payment-mode="live">
            <snipcart-settings>
                <snipcart-price-settings price-currency-code="USD" currency-iso-code="USD" symbol="$" symbol-position="after" always-format-decimal="true">
                    <snipcart-tax-tax-id-type="tax-inclusive">tax-inclusive</snipcart-tax-tax-id-type>
                </snipcart-price-settings>
            </snipcart-settings>
        </snipcart>

        <h2>Our Products</h2>

        <div class="products" id="products">
            <!-- Embedded products for GitHub Pages (static) -->
            <script>
            const products = [
                {"id": "1", "name": "liljarv.dev Research Pack", "price": 29.99, "sku": "LILJARV-001", "description": "Premium finished products from liljarv.dev. Complete toolkit with GitHub downloads, Stripe integration, and full automation. Get your production-ready e-commerce site immediately.", "image": "https://liljarv.dev/image/liljarv-main.jpg"},
                {"id": "2", "name": "liljarv.dev Pro", "price": 49.99, "sku": "LILJARV-002", "description": "Enterprise edition with advanced features, priority support, custom webhooks, and premium documentation.", "image": "https://liljarv.dev/image/liljarv-pro.jpg"}
            ];

            container.innerHTML = products.map(p => `
                <div class="product-card" data-snipcart-item="${p.id}">
                    <div class="product-image"></div>
                    <div class="product-title">${p.name}</div>
                    <div class="product-price">$${p.price.toFixed(2)}</div>
                    <div class="product-description">${p.description || 'Premium quality'}</div>
                    <button class="btn" data-snipcart-item-name="${p.name}" data-snipcart-item-price="${p.price}" data-snipcart-item-sku="${p.sku}">Add to Cart</button>
                </div>
            `).join('');
            </script>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 JarvStore. All rights reserved.</p>
        <p>Powered by Jarv</p>
    </footer>

    <script>
        // Products are embedded statically - no API fetch needed for GitHub Pages
        // Checkout handled by Snipcart
    </script>
</body>
</html>
